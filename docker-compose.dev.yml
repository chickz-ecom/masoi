# Local development infrastructure only (Postgres + Redis).
# Ports are offset (55432 / 56379) to avoid clashing with other local services.
name: masoi-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: masoi
      POSTGRES_PASSWORD: masoi_dev_password
      POSTGRES_DB: masoi
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - masoi-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U masoi -d masoi']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - masoi-dev-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  masoi-dev-pg:
  masoi-dev-redis:
