# Ma Sói trên VPS dùng chung với Kestrel (Search app).
# - Không có Nginx/certbot: Caddy trên host (của Kestrel) nhận HTTPS từ Cloudflare và chuyển vào 127.0.0.1.
# - Postgres/Redis RIÊNG của Ma Sói (không publish cổng), có giới hạn RAM → không ảnh hưởng Kestrel.
# - Cổng host chỉ bind 127.0.0.1: web 3100, game-server 4100 (Kestrel dùng 3000, 8787, 9464, 5432, 6379, 8108).
# Chạy từ /opt/masoi:  docker compose -f deploy/vps-shared/compose.yml --env-file .env.production up -d
name: masoi

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: masoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: masoi
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=40']
    volumes: ['pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U masoi -d masoi']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '96mb', '--maxmemory-policy', 'volatile-lru']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
    logging: *logging

  # One-shot: Prisma migrations before the game server starts (runs on every `up`, no-op when in sync).
  migrate:
    build: { context: ../.., dockerfile: apps/game-server/Dockerfile }
    image: masoi-game-server:latest
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://masoi:${POSTGRES_PASSWORD}@postgres:5432/masoi?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  game-server:
    image: masoi-game-server:latest
    restart: unless-stopped
    ports: ['127.0.0.1:${MASOI_GAME_PORT:-4100}:4000']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://masoi:${POSTGRES_PASSWORD}@postgres:5432/masoi?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env.production}
      # Caddy on the host forwards the real client IP (CF-Connecting-IP) in X-Forwarded-For.
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      TTS_URL: ${TTS_URL:-}
      TTS_VOICE: ${TTS_VOICE:-Hải Đăng}
      TTS_API_KEY: ${TTS_API_KEY:-}
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 20s
    mem_limit: 512m
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_GAME_SERVER_URL: '' }
    image: masoi-web:latest
    restart: unless-stopped
    ports: ['127.0.0.1:${MASOI_WEB_PORT:-3100}:3000']
    depends_on:
      game-server: { condition: service_healthy }
    mem_limit: 512m
    logging: *logging

volumes:
  pg:
  redis:
